name: Release

# Triggered when a version tag (v*) is pushed.
# Convention: tag name = v<version>, e.g. v0.1.0, v0.2.0-rc1
# Version source of truth: the `version` field in apisix/plugins/yar_grpc_bridge.lua
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify plugin version matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PLUGIN_VERSION=$(grep '^version' apisix/plugins/yar_grpc_bridge.lua | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION plugin=$PLUGIN_VERSION"
            exit 1
          fi
          echo "Version match OK: $TAG_VERSION"

      - name: Create source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix=apisix-plugin-yar-grpc-${VERSION}/ \
            -o apisix-plugin-yar-grpc-${VERSION}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            APISIX custom plugin: YAR ↔ gRPC protocol bridge for Apache APISIX.

            ## Installation

            Copy `apisix/plugins/yar_grpc_bridge.lua` to your APISIX deployment
            and configure `extra_lua_path` + `plugins` in `config.yaml`.
            See [README](https://github.com/fangfengxiang/apisix-plugin-yar-grpc#readme).

            Dependencies: [lua-resty-yar-grpc-bridge](https://github.com/fangfengxiang/lua-resty-yar-grpc-bridge) >= 0.1.2, [lua-resty-http](https://github.com/ledgetech/lua-resty-http).
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            apisix-plugin-yar-grpc-${{ steps.version.outputs.version }}.tar.gz
