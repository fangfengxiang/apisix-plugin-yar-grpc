# nginx_yar2grpc.conf — Scenario 1: PHP Yar → APISIX (yar2grpc) → Go gRPC
#
# OpenResty listens on @PORT_APISIX_YAR2GRPC@ (HTTP/1.1), receives YAR requests,
# the APISIX plugin parses the service name from the URI and delegates
# to yar2grpc_endpoint.handle() which converts to gRPC and calls the Go HTTP bridge
# (@PORT_GO_HTTP@) via lua-resty-http.

daemon off;
worker_processes 1;
pid @RUN@/nginx-apisix-yar2grpc.pid;
error_log @RUN@/logs/nginx-apisix-yar2grpc_error.log info;

events {
    worker_connections 64;
}

http {
    # APISIX plugin source + bridge source lib (mounted at /bridge at runtime)
    lua_package_path "@PREFIX@/?.lua;@BRIDGE_LIB@/?.lua;@BRIDGE_LIB@/?/init.lua;;";
    client_body_buffer_size 2m;
    client_body_temp_path @RUN@/client_body_temp_yar2grpc;
    access_log @RUN@/logs/nginx-apisix-yar2grpc_access.log;

    server {
        listen @PORT_APISIX_YAR2GRPC@;
        client_max_body_size 10m;

        # Declare $service_name at server level so it's always settable
        set $service_name "";

        # YAR endpoint — nginx named capture extracts service_name from path
        # PHP Yar client: new Yar_Client("http://127.0.0.1:1995/api/calculator.Calculator")
        location ~ ^/api/(?<service_name>[^/]+)$ {
            content_by_lua_block {
                local plugin = require("apisix.plugins.yar_grpc_bridge")
                plugin.access({
                    direction = "yar2grpc",
                    services = {
                        ["calculator.Calculator"] = {
                            proto = "@PREFIX@/t/e2e/proto/calculator.pb",
                            methods = { "Add", "Subtract" },
                        },
                    },
                    grpc_backend_url = "http://127.0.0.1:@PORT_GO_HTTP@",
                    yar_path_prefix = "/api/",
                }, {})
            }
        }
    }
}
